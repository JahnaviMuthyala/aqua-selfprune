[project]
name = "aqua-selfprune"
version = "0.1.0"
description = "From-scratch autodiff + self-pruning MLP (NumPy only)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
